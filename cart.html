<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Farmers Market</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Farmers Market</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart (<span id="cartCount">0</span>)</a></li>
                    <li><a href="#" id="loginBtn">Login</a></li>
                    <li><a href="#" id="registerBtn">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Your Shopping Cart</h2>
        
        <section id="cartItems">
            <p id="emptyCartMessage">Your cart is empty. <a href="products.html">Browse products</a> to add items.</p>
        </section>

        <section id="cartSummary" style="display:none;">
            <div class="summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="cartSubtotal">Rs0.00</span>
                </div>
                <div class="summary-row">
                    <span>Delivery:</span>
                    <span id="cartDelivery">Rs0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="cartTotal">Rs0.00</span>
                </div>
                <button id="checkoutBtn" class="btn btn-primary">Proceed to Checkout</button>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Farmers Market. All rights reserved.</p>
        </div>
    </footer>
    <script src="cart.js"></script>
    <script src="auth.js"></script>
    <script src="main.js"></script>
    </body>
    </html>
