<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Farmers Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>
    <header>
        <div class="container">
            <h1 class="logo">Farmers Market</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="cart.html">Cart (<span id="cartCount">0</span>)</a></li>
                    <li id="addProductNavItem" style="display:none;"><a href="farmer-dashboard.html"
                            class="btn btn-outline">Add Product</a></li>
                    <li class="user-dropdown" style="display:none;">
                        <button class="user-btn">
                            <span class="user-avatar"></span>
                            <span class="user-name"></span>
                            <i class="fas fa-caret-down"></i>
                        </button>
                        <div class="dropdown-content">
                            <a href="#">Profile</a>
                            <a href="#" id="logoutBtn">Logout</a>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="product-filters">
            <div class="filter-header">
                <h2>Browse Products</h2>
            </div>
            <div class="filter-controls">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search products...">
                </div>
                <div class="filter-group">
                    <select id="categoryFilter">
                        <option value="">All Categories</option>
                        <option value="vegetables">Vegetables</option>
                        <option value="fruits">Fruits</option>
                        <option value="grains">Grains</option>
                        <option value="dairy">Dairy</option>
                    </select>
                </div>
                <div class="filter-group">
                    <select id="locationFilter">
                        <option value="">All Locations</option>
                    </select>
                </div>
                <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
            </div>
        </section>

        <section class="product-list">
            <div id="productsContainer">
                <!-- Products will be loaded here by JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 Farmers Market. All rights reserved.</p>
        </div>
    </footer>

    <!-- Product Detail Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="productDetail">
                <!-- Product details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- <script src="products.js"></script> -->
    <script>
        // Check if user is a farmer and show/hide Add Product button
        document.addEventListener('DOMContentLoaded', function () {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
            const addProductNavItem = document.getElementById('addProductNavItem');

            if (currentUser && currentUser.isFarmer) {
                addProductNavItem.style.display = 'block';
            } else {
                addProductNavItem.style.display = 'none';
            }

            // Initialize cart count
            updateCartCount();
        });

        // Update cart count function
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const cartCount = document.getElementById('cartCount');
            if (cartCount) {
                cartCount.textContent = cart.reduce((total, item) => total + item.quantity, 0);
            }
        }
    </script>

    <script src="auth.js"></script>
    <script src="products.js"></script>
    <script src="main.js"></script>
</body>

</html>
