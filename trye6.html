<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Dashboard - Farmers Market</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #388E3C;
            --text-color: #333;
            --light-text: #fff;
            --gray-light: #f5f5f5;
            --gray-medium: #e0e0e0;
            --gray-dark: #757575;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: #f9f9f9;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
        }

        header {
            background-color: var(--primary-color);
            color: var(--light-text);
            padding: 1rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 1.5rem;
        }

        nav ul li a {
            color: var(--light-text);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        nav ul li a:hover {
            opacity: 0.8;
        }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            border: 2px solid transparent;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .dashboard-header {
            margin: 2rem 0;
            text-align: center;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .info-card {
            background-color: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            margin-bottom: 2rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .farmer-product-card {
            background-color: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            position: relative;
            transition: transform 0.3s;
        }

        .farmer-product-card:hover {
            transform: translateY(-5px);
        }

        .farmer-product-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            background-color: white;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            position: relative;
        }

        .close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-dark);
        }

        .close:hover {
            color: var(--text-color);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--gray-medium);
            border-radius: 8px;
            font-size: 1rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 768px) {
            header .container {
                flex-direction: column;
                text-align: center;
            }
            
            nav ul {
                margin-top: 1rem;
                justify-content: center;
            }
            
            nav ul li {
                margin: 0 0.5rem;
            }
            
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 class="logo">Farmers Market</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="farmer-dashboard.html" class="active">Dashboard</a></li>
                    <li><a href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="dashboard-header">
            <h2>Farmer Dashboard</h2>
            <p>Manage your products and orders</p>
        </div>
        
        <section class="farmer-info">
            <div class="section-header">
                <h3>Your Farm Information</h3>
                <button id="editFarmInfo" class="btn btn-outline">Edit Information</button>
            </div>
            <div id="farmInfo" class="info-card">
                <!-- Farm info will be loaded here -->
            </div>
        </section>

        <section class="products-management">
            <div class="section-header">
                <h3>Your Products</h3>
                <button id="addProductBtn" class="btn btn-primary">Add Product</button>
            </div>
            <div id="farmerProducts" class="products-grid">
                <!-- Farmer's products will be listed here -->
            </div>
        </section>

        <section class="orders">
            <div class="section-header">
                <h3>Recent Orders</h3>
            </div>
            <div id="farmerOrders" class="info-card">
                <p>No orders yet. Your orders will appear here when customers purchase your products.</p>
            </div>
        </section>
    </main>

    <!-- Add/Edit Product Modal -->
    <div id="productFormModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="productFormTitle">Add New Product</h3>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-row">
                    <div class="form-group">
                        <label for="productName">Product Name*</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Category*</label>
                        <select id="productCategory" required>
                            <option value="">Select Category</option>
                            <option value="vegetables">Vegetables</option>
                            <option value="fruits">Fruits</option>
                            <option value="grains">Grains</option>
                            <option value="dairy">Dairy</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="productPrice">Price (₹)*</label>
                        <input type="number" id="productPrice" min="1" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="productQuantity">Quantity Available*</label>
                        <input type="number" id="productQuantity" min="1" required>
                    </div>
                    <div class="form-group">
                        <label for="productUnit">Unit*</label>
                        <select id="productUnit" required>
                            <option value="kg">kg</option>
                            <option value="g">g</option>
                            <option value="piece">piece</option>
                            <option value="dozen">dozen</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="productDescription">Description</label>
                    <textarea id="productDescription" rows="4"></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-outline cancel-btn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // DOM Elements
        const farmInfo = document.getElementById('farmInfo');
        const editFarmInfoBtn = document.getElementById('editFarmInfo');
        const farmerProducts = document.getElementById('farmerProducts');
        const addProductBtn = document.getElementById('addProductBtn');
        const productFormModal = document.getElementById('productFormModal');
        const productForm = document.getElementById('productForm');
        const productFormTitle = document.getElementById('productFormTitle');
        const logoutBtn = document.getElementById('logoutBtn');
        const closeModalBtns = document.querySelectorAll('.close, .cancel-btn');

        // Initialize dashboard
        function initDashboard() {
            const user = JSON.parse(localStorage.getItem('currentUser '));
            
            if (!user || !user.isFarmer) {
                window.location.href = 'index.html';
                return;
            }
            
            displayFarmInfo(user);
            displayFarmerProducts(user.id);
        }

        // Display farm information
        function displayFarmInfo(user) {
            farmInfo.innerHTML = `
                <p><strong>Farm Name:</strong> ${user.farmName || 'Not set'}</p>
                <p><strong>Location:</strong> ${user.location || 'Not set'}</p>
                <p><strong>Email:</strong> ${user.email || 'Not set'}</p>
                <p><strong>Phone:</strong> ${user.phone || 'Not set'}</p>
            `;
        }

        // Display farmer's products
        function displayFarmerProducts(farmerId) {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const farmerProductsList = products.filter(p => p.farmerId === farmerId);
            
            if (farmerProductsList.length === 0) {
                farmerProducts.innerHTML = '<p>You have no products listed yet.</p>';
                return;
            }
            
            farmerProducts.innerHTML = '';
            
            farmerProductsList.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'farmer-product-card';
                productCard.innerHTML = `
                    <h3>${product.name}</h3>
                    <p><strong>Category:</strong> ${product.category}</p>
                    <p><strong>Price:</strong> ₹${product.price.toFixed(2)} per ${product.unit}</p>
                    <p><strong>Available:</strong> ${product.quantity} ${product.unit}</p>
                    <p><strong>Description:</strong> ${product.description || 'None'}</p>
                    <div class="farmer-product-actions">
                        <button class="btn btn-outline edit-product" data-id="${product.id}">Edit</button>
                        <button class="btn btn-outline delete-product" data-id="${product.id}">Delete</button>
                    </div>
                `;
                farmerProducts.appendChild(productCard);
            });
            
            // Add event listeners to edit/delete buttons
            document.querySelectorAll('.edit-product').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    editProduct(e.target.getAttribute('data-id'));
                });
            });
            
            document.querySelectorAll('.delete-product').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (confirm('Are you sure you want to delete this product?')) {
                        deleteProduct(e.target.getAttribute('data-id'));
                    }
                });
            });
        }

        // Add new product
        addProductBtn.addEventListener('click', () => {
            productFormTitle.textContent = 'Add New Product';
            document.getElementById('productId').value = '';
            productForm.reset();
            productFormModal.style.display = 'block';
        });

        // Edit product
        function editProduct(productId) {
            const products = JSON.parse(localStorage.getItem('products')) || [];
            const product = products.find(p => p.id === productId);
            
            if (!product) return;
            
            productFormTitle.textContent = 'Edit Product';
            document.getElementById('productId').value = product.id;
            document.getElementById('productName').value = product.name;
            document.getElementById('productCategory').value = product.category;
            document.getElementById('productPrice').value = product.price;
            document.getElementById('productQuantity').value = product.quantity;
            document.getElementById('productUnit').value = product.unit;
            document.getElementById('productDescription').value = product.description || '';
            
            productFormModal.style.display = 'block';
        }

        // Delete product
        function deleteProduct(productId) {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            products = products.filter(p => p.id !== productId);
            localStorage.setItem('products', JSON.stringify(products));
            
            const user = JSON.parse(localStorage.getItem('currentUser '));
            displayFarmerProducts(user.id);
        }

        // Save product (add or edit)
        productForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const user = JSON.parse(localStorage.getItem('currentUser '));
            let products = JSON.parse(localStorage.getItem('products')) || [];
            
            const productId = document.getElementById('productId').value;
            const isEdit = !!productId;
            
            const productData = {
                id: isEdit ? productId : 'product_' + Date.now(),
                name: document.getElementById('productName').value,
                category: document.getElementById('productCategory').value,
                price: parseFloat(document.getElementById('productPrice').value),
                quantity: parseInt(document.getElementById('productQuantity').value),
                unit: document.getElementById('productUnit').value,
                description: document.getElementById('productDescription').value,
                farmerId: user.id,
                farmerName: user.farmName || user.name,
                location: user.location || 'Unknown',
                image: 'https://via.placeholder.com/300x200?text=Product'
            };
            
            if (isEdit) {
                // Update existing product
                products = products.map(p => p.id === productId ? productData : p);
            } else {
                // Add new product
                products.push(productData);
            }
            
            localStorage.setItem('products', JSON.stringify(products));
            productFormModal.style.display = 'none';
            displayFarmerProducts(user.id);
        });

        // Edit farm info
        editFarmInfoBtn.addEventListener('click', () => {
            const user = JSON.parse(localStorage.getItem('currentUser '));
            const newFarmName = prompt('Enter your farm name:', user.farmName || '');
            const newLocation = prompt('Enter your location:', user.location || '');
            
            if (newFarmName !== null && newLocation !== null) {
                // Update user info
                user.farmName = newFarmName;
                user.location = newLocation;
                
                // Save updated user
                localStorage.setItem('currentUser ', JSON.stringify(user));
                
                // Update products with new farm name
                let products = JSON.parse(localStorage.getItem('products')) || [];
                products = products.map(p => {
                    if (p.farmerId === user.id) {
                        return {
                            ...p,
                            farmerName: newFarmName,
                            location: newLocation
                        };
                    }
                    return p;
                });
                localStorage.setItem('products', JSON.stringify(products));
                
                // Update displayed info
                displayFarmInfo(user);
                displayFarmerProducts(user.id);
            }
        });

        // Close modals
        closeModalBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                productFormModal.style.display = 'none';
            });
        });

        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === productFormModal) {
                productFormModal.style.display = 'none';
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('current User ');
            window.location.href = 'index.html';
        });

        // Initialize page
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
